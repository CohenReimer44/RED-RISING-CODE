<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Space VR Scene</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('cave-shell', {
        init: function () {
          var geometry = new THREE.IcosahedronGeometry(1, 20);
          var sourcePositions = geometry.attributes.position;
          var keptPositions = [];

          for (var i = 0; i < sourcePositions.count; i += 3) {
            var x = (sourcePositions.getX(i) + sourcePositions.getX(i + 1) + sourcePositions.getX(i + 2)) / 3;
            var y = (sourcePositions.getY(i) + sourcePositions.getY(i + 1) + sourcePositions.getY(i + 2)) / 3;
            var z = (sourcePositions.getZ(i) + sourcePositions.getZ(i + 1) + sourcePositions.getZ(i + 2)) / 3;
            if (z < -0.82 && Math.abs(x - 0.28) < 0.16 && Math.abs(y) < 0.16) {
              continue;
            }

            for (var vertex = 0; vertex < 3; vertex++) {
              var index = i + vertex;
              var vertexX = sourcePositions.getX(index);
              var vertexY = sourcePositions.getY(index);
              var vertexZ = sourcePositions.getZ(index);
              var roughness = 1 +
                0.035 * Math.sin(vertexX * 23 + vertexY * 17) *
                Math.cos(vertexZ * 19 - vertexY * 11) +
                0.018 * Math.sin(vertexZ * 41 + vertexX * 29);
              keptPositions.push(
                vertexX * roughness,
                vertexY * roughness,
                vertexZ * roughness
              );
            }
          }

          geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.Float32BufferAttribute(keptPositions, 3));
          geometry.computeVertexNormals();
          var material = new THREE.MeshStandardMaterial({
            color: '#45362d',
            side: THREE.BackSide,
            roughness: 1,
            metalness: 0
          });
          this.el.setObject3D('mesh', new THREE.Mesh(geometry, material));
        }
      });

      AFRAME.registerComponent('cave-rock', {
        init: function () {
          var geometry = new THREE.IcosahedronGeometry(1, 3);
          var positions = geometry.attributes.position;
          var colors = [];
          var black = new THREE.Color('#080709');
          var deepRed = new THREE.Color('#35080e');

          for (var i = 0; i < positions.count; i++) {
            var x = positions.getX(i);
            var y = positions.getY(i);
            var z = positions.getZ(i);
            var variation = 0.5 + 0.5 *
              Math.sin(x * 17 + y * 11 + z * 23) *
              Math.cos(x * 9 - y * 13 + z * 7);
            var radius = 0.84 + 0.16 *
              Math.sin(x * 13 + z * 19) * Math.cos(y * 17);
            positions.setXYZ(i, x * radius, y * radius, z * radius);
            var color = black.clone().lerp(deepRed, variation * 0.75);
            colors.push(color.r, color.g, color.b);
          }

          geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
          geometry.computeVertexNormals();
          var material = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.96,
            metalness: 0
          });
          this.el.setObject3D('mesh', new THREE.Mesh(geometry, material));
        }
      });

      AFRAME.registerComponent('cave-ore-material', {
        init: function () {
          this.onModelLoaded = this.updateMaterials.bind(this);
          this.el.addEventListener('model-loaded', this.onModelLoaded);
          this.updateMaterials();
        },

        subdivideGeometry: function (source) {
          var sourcePositions = source.attributes.position;
          var sourceIndices = source.index;
          var triangles = [];
          for (var index = 0; index < (sourceIndices ? sourceIndices.count : sourcePositions.count); index += 3) {
            var aIndex = sourceIndices ? sourceIndices.getX(index) : index;
            var bIndex = sourceIndices ? sourceIndices.getX(index + 1) : index + 1;
            var cIndex = sourceIndices ? sourceIndices.getX(index + 2) : index + 2;
            triangles.push([
              new THREE.Vector3().fromBufferAttribute(sourcePositions, aIndex),
              new THREE.Vector3().fromBufferAttribute(sourcePositions, bIndex),
              new THREE.Vector3().fromBufferAttribute(sourcePositions, cIndex)
            ]);
          }

          for (var level = 0; level < 2; level++) {
            var refined = [];
            triangles.forEach(function (triangle) {
              var a = triangle[0];
              var b = triangle[1];
              var c = triangle[2];
              var ab = a.clone().add(b).multiplyScalar(0.5);
              var bc = b.clone().add(c).multiplyScalar(0.5);
              var ca = c.clone().add(a).multiplyScalar(0.5);
              refined.push(
                [a, ab, ca],
                [ab, b, bc],
                [ca, bc, c],
                [ab, bc, ca]
              );
            });
            triangles = refined;
          }

          var geometry = new THREE.BufferGeometry();
          var positions = [];
          var colors = [];
          var indices = [];
          var vertexByPosition = {};
          var black = new THREE.Color('#100b0d');
          var red = new THREE.Color('#55101a');

          triangles.forEach(function (triangle) {
            triangle.forEach(function (point) {
              var key = point.x.toFixed(5) + ',' + point.y.toFixed(5) + ',' + point.z.toFixed(5);
              var vertexIndex = vertexByPosition[key];
              if (vertexIndex === undefined) {
                vertexIndex = positions.length / 3;
                vertexByPosition[key] = vertexIndex;
                positions.push(point.x, point.y, point.z);
                var variation = Math.sin(point.x * 17 + point.y * 11 + point.z * 23) *
                  Math.cos(point.x * 9 - point.y * 15 + point.z * 7);
                var mineralColor = black.clone().lerp(red, THREE.MathUtils.smoothstep(variation, -0.25, 0.8));
                colors.push(mineralColor.r, mineralColor.g, mineralColor.b);
              }
              indices.push(vertexIndex);
            });
          });

          geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
          geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
          geometry.setIndex(indices);
          geometry.computeVertexNormals();
          geometry.computeBoundingSphere();
          return geometry;
        },

        updateMaterials: function () {
          var model = this.el.getObject3D('mesh');
          if (!model) {
            return;
          }
          var component = this;
          model.traverse(function (object) {
            if (!object.isMesh || object.userData.caveOreProcessed) {
              return;
            }
            var materials = Array.isArray(object.material)
              ? object.material : [object.material];
            var whiteMaterials = materials.filter(function (material) {
              return material.color &&
                material.color.r > 0.85 &&
                material.color.g > 0.85 &&
                material.color.b > 0.85;
            });
            if (!whiteMaterials.length) {
              return;
            }

            var allWhite = whiteMaterials.length === materials.length;
            if (allWhite) {
              object.geometry = component.subdivideGeometry(object.geometry);
            }
            var mineralMaterial = new THREE.MeshStandardMaterial({
              color: '#ffffff',
              vertexColors: true,
              roughness: 0.94,
              metalness: 0.06
            });
            object.material = Array.isArray(object.material)
              ? materials.map(function (material) {
                return whiteMaterials.indexOf(material) !== -1 ? mineralMaterial : material;
              })
              : mineralMaterial;
            object.userData.caveOreProcessed = true;
          });
        },

        remove: function () {
          this.el.removeEventListener('model-loaded', this.onModelLoaded);
        }
      });

      AFRAME.registerComponent('cave-formations', {
        init: function () {
          var geometry = new THREE.ConeGeometry(0.48, 1.8, 7, 5);
          var positions = geometry.attributes.position;
          for (var vertex = 0; vertex < positions.count; vertex++) {
            var x = positions.getX(vertex);
            var y = positions.getY(vertex);
            var z = positions.getZ(vertex);
            var angle = Math.atan2(z, x);
            var roughness = 1 +
              0.09 * Math.sin(angle * 3 + y * 4) +
              0.045 * Math.cos(angle * 5 - y * 7);
            positions.setXYZ(vertex, x * roughness, y, z * roughness);
          }
          geometry.computeVertexNormals();
          var material = new THREE.MeshStandardMaterial({
            color: '#55483e',
            roughness: 0.96,
            metalness: 0.02,
            flatShading: true
          });
          var group = new THREE.Group();
          var stalactites = [
            [-8, -6.5, 1.8], [-4.3, -8.5, 1.3], [4.1, -7, 1.7], [8, -9.5, 2],
            [-7.7, -13.5, 1.5], [7.6, -15.5, 1.8], [-8.2, -18.5, 1.3], [8.4, -19.5, 1.6]
          ];
          var stalagmites = [
            [-8.3, -8, 1.15], [8.2, -7, 0.9], [-7.8, -12, 1.35], [8, -13, 1.1],
            [-8.4, -17, 0.95], [8.3, -18, 1.3]
          ];

          stalactites.forEach(function (formation) {
            var height = formation[2];
            var mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(formation[0], 6.8 - height / 2, formation[1]);
            mesh.rotation.x = Math.PI;
            mesh.scale.set(0.8, height / 1.8, 0.8);
            mesh.castShadow = true;
            group.add(mesh);
          });
          stalagmites.forEach(function (formation) {
            var height = formation[2];
            var mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(formation[0], height / 2 - 0.12, formation[1]);
            mesh.scale.set(0.85, height / 1.8, 0.85);
            mesh.castShadow = true;
            group.add(mesh);
          });
          this.el.setObject3D('mesh', group);
        }
      });

      AFRAME.registerComponent('cave-exit-seal', {
        init: function () {
          var shape = new THREE.Shape();
          shape.absarc(0, 0, 3.2, 0, Math.PI * 2, false);
          var opening = new THREE.Path();
          opening.absarc(0, 0, 1.85, 0, Math.PI * 2, true);
          shape.holes.push(opening);

          var geometry = new THREE.ExtrudeGeometry(shape, {
            depth: 0.55,
            bevelEnabled: true,
            bevelThickness: 0.08,
            bevelSize: 0.06,
            bevelSegments: 2,
            curveSegments: 40
          });
          var positions = geometry.attributes.position;
          for (var vertex = 0; vertex < positions.count; vertex++) {
            var x = positions.getX(vertex);
            var y = positions.getY(vertex);
            var z = positions.getZ(vertex);
            var angle = Math.atan2(y, x);
            var roughness = 1 +
              0.018 * Math.sin(angle * 11) +
              0.012 * Math.cos(angle * 17 + 0.6);
            positions.setXYZ(vertex, x * roughness, y * roughness,
              z + 0.025 * Math.sin(angle * 13 + z * 9));
          }
          geometry.computeVertexNormals();

          var material = new THREE.MeshStandardMaterial({
            color: '#45362d',
            side: THREE.DoubleSide,
            roughness: 1,
            metalness: 0
          });
          this.el.setObject3D('mesh', new THREE.Mesh(geometry, material));
        }
      });

      AFRAME.registerComponent('mine-hallway', {
        init: function () {
          var path = new THREE.CatmullRomCurve3([
            new THREE.Vector3(3.4, 1.7, -23.3),
            new THREE.Vector3(3.4, 1.7, -25.5),
            new THREE.Vector3(3.4, 1.7, -28.2),
            new THREE.Vector3(3.1, 1.7, -29.8),
            new THREE.Vector3(1.7, 1.7, -31.1),
            new THREE.Vector3(0, 1.7, -32.5),
            new THREE.Vector3(0, 1.7, -36),
            new THREE.Vector3(0, 1.7, -40),
            new THREE.Vector3(0, 1.7, -44)
          ]);
          this.path = path;
          var geometry = new THREE.TubeGeometry(path, 128, 1.85, 28, false);
          var positions = geometry.attributes.position;
          var normals = geometry.attributes.normal;

          for (var vertex = 0; vertex < positions.count; vertex++) {
            var x = positions.getX(vertex);
            var y = positions.getY(vertex);
            var z = positions.getZ(vertex);
            var normalX = normals.getX(vertex);
            var normalY = normals.getY(vertex);
            var normalZ = normals.getZ(vertex);
            var roughness = 1 +
              0.035 * Math.sin(x * 23 + y * 17) * Math.cos(z * 19 - y * 11) +
              0.018 * Math.sin(z * 41 + x * 29);
            var radialOffset = (roughness - 1) * 1.85;
            positions.setXYZ(
              vertex,
              x + normalX * radialOffset,
              y + normalY * radialOffset,
              z + normalZ * radialOffset
            );
          }
          geometry.computeVertexNormals();
          var material = new THREE.MeshStandardMaterial({
            color: '#45362d',
            side: THREE.BackSide,
            roughness: 1,
            metalness: 0
          });
          this.el.setObject3D('mesh', new THREE.Mesh(geometry, material));
        }
      });

      AFRAME.registerComponent('grass-field', {
        init: function () {
          var positions = [];
          var colors = [];
          var hallway = this.el.sceneEl.querySelector('[mine-hallway]');
          hallway.object3D.updateMatrixWorld(true);
          this.el.object3D.updateMatrixWorld(true);
          var hallwayPath = hallway.components['mine-hallway'].path;
          var hallwaySamples = [];
          for (var sample = 0; sample <= 72; sample++) {
            var hallwayPoint = hallwayPath.getPointAt(sample / 72);
            hallway.object3D.localToWorld(hallwayPoint);
            this.el.object3D.worldToLocal(hallwayPoint);
            hallwaySamples.push(hallwayPoint);
          }
          var seed = 41;
          var random = function () {
            seed = (seed * 16807) % 2147483647;
            return (seed - 1) / 2147483646;
          };

          for (var blade = 0; blade < 900; blade++) {
            var x = (random() - 0.5) * 34;
            var z = random() * 23 - 17;
            var nearHallway = false;
            for (var sampleIndex = 0; sampleIndex < hallwaySamples.length; sampleIndex++) {
              var dx = x - hallwaySamples[sampleIndex].x;
              var dz = z - hallwaySamples[sampleIndex].z;
              if (dx * dx + dz * dz < 2.2 * 2.2) {
                nearHallway = true;
                break;
              }
            }
            if (nearHallway) {
              continue;
            }

            var height = 0.16 + random() * 0.42;
            var halfWidth = 0.012 + random() * 0.018;
            var lean = (random() - 0.5) * 0.18;
            var baseColor = 0.48 + random() * 0.35;
            var verts = [
              [x - halfWidth, 0, z],
              [x + halfWidth, 0, z],
              [x + lean, height, z + lean],
              [x, 0, z - halfWidth],
              [x, 0, z + halfWidth],
              [x + lean, height, z + lean]
            ];

            for (var vertex = 0; vertex < verts.length; vertex++) {
              positions.push(verts[vertex][0], verts[vertex][1], verts[vertex][2]);
              colors.push(baseColor * 0.58, baseColor, baseColor * 0.42);
            }
          }

          var geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
          geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
          geometry.computeVertexNormals();
          var material = new THREE.MeshStandardMaterial({
            vertexColors: true,
            side: THREE.DoubleSide,
            roughness: 1
          });
          this.el.setObject3D('mesh', new THREE.Mesh(geometry, material));
        }
      });

      AFRAME.registerComponent('garden-tree', {
        init: function () {
          var group = new THREE.Group();
          var trunkMaterial = new THREE.MeshStandardMaterial({color: '#493324', roughness: 0.95});
          var leafMaterials = [
            new THREE.MeshStandardMaterial({color: '#285b37', roughness: 0.92}),
            new THREE.MeshStandardMaterial({color: '#397446', roughness: 0.92}),
            new THREE.MeshStandardMaterial({color: '#527f49', roughness: 0.92})
          ];
          var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.25, 2.8, 8), trunkMaterial);
          trunk.position.y = 1.4;
          group.add(trunk);

          var canopyLayers = [
            {radius: 1.22, y: 2.55, scale: [1, 0.95, 0.9]},
            {radius: 0.98, y: 3.35, scale: [1.05, 0.9, 0.95]},
            {radius: 0.72, y: 4.05, scale: [1, 1, 0.9]}
          ];
          for (var i = 0; i < canopyLayers.length; i++) {
            var layer = canopyLayers[i];
            var canopy = new THREE.Mesh(
              new THREE.SphereGeometry(layer.radius, 12, 9),
              leafMaterials[i]
            );
            canopy.position.y = layer.y;
            canopy.scale.set(layer.scale[0], layer.scale[1], layer.scale[2]);
            canopy.castShadow = true;
            group.add(canopy);
          }

          var sideLeaves = [
            {x: -0.62, y: 2.85, z: 0.18},
            {x: 0.58, y: 3.12, z: -0.12},
            {x: -0.22, y: 3.65, z: -0.52}
          ];
          for (var leaf = 0; leaf < sideLeaves.length; leaf++) {
            var cluster = new THREE.Mesh(
              new THREE.SphereGeometry(0.72, 10, 8),
              leafMaterials[(leaf + 1) % leafMaterials.length]
            );
            cluster.position.set(sideLeaves[leaf].x, sideLeaves[leaf].y, sideLeaves[leaf].z);
            cluster.scale.set(1, 0.86, 0.9);
            cluster.castShadow = true;
            group.add(cluster);
          }
          group.children[0].castShadow = true;
          this.el.setObject3D('mesh', group);
        }
      });

      AFRAME.registerComponent('surface-trees', {
        init: function () {
          var placements = [
            [-52,-0.12,-18,0.9,0.9,0.9],[57,-0.12,-34,1.05,1,1.05],
            [-66,-0.12,-55,1.1,1.05,1.1],[50,-0.12,-76,0.85,0.9,0.85],
            [72,-0.12,-104,1.15,1.1,1.15],[-55,-0.12,-115,1,1.05,1.05],
            [-78,-0.12,-151,1.15,1.1,1.15],[58,-0.12,-163,0.95,1,0.95],
            [76,-0.12,-201,1.2,1.15,1.2],[-58,-0.12,-215,0.95,0.9,0.95],
            [-72,-0.12,-257,1.1,1.05,1.1],[54,-0.12,-264,1,1.05,1],
            [-96,-0.12,8,1.05,1,1.05],[88,-0.12,4,0.9,0.95,0.9],
            [108,-0.12,-24,1.15,1.1,1.15],[-84,-0.12,-39,0.95,1,0.95],
            [92,-0.12,-62,1.1,1.05,1.1],[-112,-0.12,-82,1.2,1.15,1.2],
            [116,-0.12,-96,0.9,0.95,0.9],[-94,-0.12,-128,1.05,1,1.05],
            [102,-0.12,-139,1.15,1.1,1.15],[-116,-0.12,-176,0.95,1,0.95],
            [94,-0.12,-188,1.05,1,1.05],[-98,-0.12,-231,1.15,1.1,1.15],
            [112,-0.12,-235,1,1.05,1],[-120,-0.12,-276,0.95,1,0.95],
            [96,-0.12,-280,1.15,1.1,1.15]
          ];
          placements.forEach(function (placement) {
            var tree = document.createElement('a-entity');
            tree.setAttribute('garden-tree', '');
            tree.setAttribute('position', placement.slice(0, 3).join(' '));
            tree.setAttribute('scale', placement.slice(3).join(' '));
            this.el.appendChild(tree);
          }, this);
        }
      });

      AFRAME.registerComponent('emporium-lighting', {
        init: function () {
          this.el.sceneEl.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        }
      });

      AFRAME.registerComponent('haemanthus', {
        init: function () {
          var group = new THREE.Group();
          var stemMaterial = new THREE.MeshStandardMaterial({color: '#315b32', roughness: 0.9});
          var leafMaterial = new THREE.MeshStandardMaterial({color: '#487a3b', roughness: 0.84});
          var flowerMaterial = new THREE.MeshStandardMaterial({
            color: '#bd1027',
            emissive: '#31030a',
            roughness: 0.72
          });
          var stem = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.055, 0.72, 7), stemMaterial);
          stem.position.y = 0.36;
          group.add(stem);

          for (var leaf = 0; leaf < 3; leaf++) {
            var blade = new THREE.Mesh(
              new THREE.SphereGeometry(0.42, 10, 7),
              leafMaterial
            );
            blade.position.set((leaf - 1) * 0.16, 0.18, leaf % 2 ? 0.08 : -0.06);
            blade.rotation.z = (leaf - 1) * -0.34;
            blade.scale.set(0.27, 0.8, 0.09);
            group.add(blade);
          }

          var bloom = new THREE.Group();
          bloom.position.y = 0.77;
          var center = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 9), flowerMaterial);
          bloom.add(center);
          var filamentGeometry = new THREE.CylinderGeometry(0.006, 0.012, 0.25, 4);
          for (var filament = 0; filament < 32; filament++) {
            var angle = filament * 2.399963229728653;
            var height = 0.12 + 0.16 * ((filament % 5) / 4);
            var radial = 0.13 + 0.1 * ((filament % 4) / 3);
            var direction = new THREE.Vector3(
              Math.cos(angle) * radial,
              height,
              Math.sin(angle) * radial
            ).normalize();
            var stalk = new THREE.Mesh(filamentGeometry, flowerMaterial);
            stalk.position.copy(direction).multiplyScalar(0.14);
            stalk.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
            bloom.add(stalk);
          }
          group.add(bloom);
          this.el.setObject3D('mesh', group);
        }
      });

      AFRAME.registerComponent('garden-girl', {
        init: function () {
          var group = new THREE.Group();
          var skin = new THREE.MeshStandardMaterial({color: '#edc0a3', roughness: 0.72});
          var hair = new THREE.MeshStandardMaterial({
            color: '#a91f27',
            emissive: '#26060a',
            roughness: 0.58
          });
          var hairHighlight = new THREE.MeshStandardMaterial({color: '#dc583d', roughness: 0.56});
          var gown = new THREE.MeshStandardMaterial({
            color: '#35101c',
            roughness: 0.68,
            metalness: 0.08
          });
          var gownHighlight = new THREE.MeshStandardMaterial({color: '#5d1828', roughness: 0.62});
          var gold = new THREE.MeshStandardMaterial({
            color: '#d7ae5e',
            metalness: 0.76,
            roughness: 0.27
          });
          var eyeWhite = new THREE.MeshStandardMaterial({color: '#f3e7dd', roughness: 0.38});
          var iris = new THREE.MeshStandardMaterial({color: '#55745d', roughness: 0.35});
          var pupil = new THREE.MeshStandardMaterial({color: '#211814', roughness: 0.28});
          var lip = new THREE.MeshStandardMaterial({color: '#874746', roughness: 0.58});
          var addMesh = function (geometry, material, x, y, z, sx, sy, sz) {
            var mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.scale.set(sx, sy, sz);
            group.add(mesh);
            return mesh;
          };

          var skirt = new THREE.LatheGeometry([
            new THREE.Vector2(0.06, 0.08),
            new THREE.Vector2(0.47, 0.14),
            new THREE.Vector2(0.56, 0.28),
            new THREE.Vector2(0.48, 0.55),
            new THREE.Vector2(0.39, 0.92),
            new THREE.Vector2(0.31, 1.3),
            new THREE.Vector2(0.29, 1.48)
          ], 32);
          addMesh(skirt, gown, 0, 0, 0, 1, 1, 0.78);
          addMesh(new THREE.LatheGeometry([
            new THREE.Vector2(0.27, 1.32),
            new THREE.Vector2(0.34, 1.48),
            new THREE.Vector2(0.26, 1.65),
            new THREE.Vector2(0.17, 1.75)
          ], 24), gown, 0, 0, 0, 1, 1, 0.75);
          addMesh(new THREE.SphereGeometry(0.32, 18, 12), skin, 0, 1.67, 0, 1.1, 0.46, 0.76);
          addMesh(new THREE.CylinderGeometry(0.095, 0.105, 0.22, 12), skin, 0, 1.83, 0.015, 1, 1, 1);

        createModel: function (source) {
          var vertices = [];

          var normalData = [];
          var uvData = [];
          var hasUVs = true;
          var lines = source.split(/\r?\n/);
          for (var lineIndex = 0; lineIndex < lines.length; lineIndex++) {
            var line = lines[lineIndex].trim();
            if (!line || line.charAt(0) === '#') {
              continue;
            }
            var fields = line.split(/\s+/);
            var values = fields.slice(1).map(Number);
            if (fields[0] === 'v') {
              vertices.push(values);
            } else if (fields[0] === 'vn') {
              normals.push(values);
            } else if (fields[0] === 'vt') {
              uvs.push(values);
            } else if (fields[0] === 'f' && fields.length >= 4) {
              var face = fields.slice(1).map(function (value) {
                var indices = value.split('/');
                var vertexIndex = Number(indices[0]);
                return {
                  vertex: vertexIndex < 0 ? vertices.length + vertexIndex : vertexIndex - 1,
                  uv: indices[1] ? (Number(indices[1]) < 0
                    ? uvs.length + Number(indices[1])
                    : Number(indices[1]) - 1) : -1,
                  normal: indices[2] ? (Number(indices[2]) < 0
                    ? normals.length + Number(indices[2])
                    : Number(indices[2]) - 1) : -1

              });
              for (var triangle = 1; triangle < face.length - 1; triangle++) {
                var triangleVertices = [face[0], face[triangle], face[triangle + 1]];
                for (var corner = 0; corner < 3; corner++) {
                  var item = triangleVertices[corner];
                  var point = vertices[item.vertex];
                  vertexData.push(point[0], point[1], point[2]);
                  if (item.normal >= 0 && normals[item.normal]) {
                    var normal = normals[item.normal];
                    normalData.push(normal[0], normal[1], normal[2]);
                  } else {
                    normalData.push(0, 0, 0);
                  }
                  if (item.uv >= 0 && uvs[item.uv]) {
                    uvData.push(uvs[item.uv][0], uvs[item.uv][1]);

          var height = geometry.boundingBox.max.y - geometry.boundingBox.min.y;
          var colors = [];
          for (var vertex = 0; vertex < positionAttribute.count; vertex += 3) {

              positionAttribute.getY(vertex) +
              positionAttribute.getY(vertex + 1) +
              positionAttribute.getY(vertex + 2)
            ) / 3;
            var centerX = (
              positionAttribute.getX(vertex) +
              positionAttribute.getX(vertex + 1) +
              positionAttribute.getX(vertex + 2)
            ) / 3;
            var centerZ = (
              positionAttribute.getZ(vertex) +
              positionAttribute.getZ(vertex + 1) +
              positionAttribute.getZ(vertex + 2)
            ) / 3;
            var color;
            if (this.data.palette === 'uncle') {

                centerY < height * 0.94 &&
                centerZ > 0.1 &&

              var isBeard = centerY > height * 0.66 &&
                centerY <= height * 0.83 &&

              color = centerY > height * 0.94 ? '#bd7d2c' :
                isFace ? '#bd896f' :
                isBeard ? '#b9b9ad' : '#41484d';
            } else if (this.data.palette === 'eo') {
              var faceWidth = height * 0.12;
              var isFace = centerY > height * 0.83 &&
                centerY < height * 0.96 &&
                centerZ > 0.13 &&
                Math.abs(centerX) < faceWidth;
              var isHair = centerY > height * 0.91 ||

              var isGoldTrim = centerY > height * 0.52 &&
                centerY < height * 0.64 &&
                centerZ > 0.11 &&
                Math.abs(centerX) < faceWidth * 1.4;

            } else {

            }
            var faceColor = new THREE.Color(color);
            for (var cornerIndex = 0; cornerIndex < 3; cornerIndex++) {
              colors.push(faceColor.r, faceColor.g, faceColor.b);

          }
          geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
          if (normalData.every(function (value) { return value === 0; })) {

            ? 'assets/uncle-narol-textured/'
            : this.data.palette === 'haemanthus'
              ? 'assets/haemanthus-textured/'

          var textureLoader = new THREE.TextureLoader();

            map: hasUVs ? diffuseMap : null,
            normalMap: hasUVs ? textureLoader.load(textureRoot + 'texture_normal.png') : null,
            roughnessMap: hasUVs ? textureLoader.load(textureRoot + 'texture_roughness.png') : null,
            metalnessMap: hasUVs ? textureLoader.load(textureRoot + 'texture_metallic.png') : null,
            roughness: this.data.palette === 'haemanthus' ? 0.92 :

            metalness: this.data.palette === 'haemanthus' ? 0 :
              this.data.palette === 'eo' ? 0.05 : 0.1,
            side: THREE.DoubleSide

        loadBuilding: function (specification) {
          var upAxis = specification.upAxis;
          return fetch(specification.src)
            .then(function (response) {
              if (!response.ok) {
                throw new Error('Unable to load city building model: ' + response.status);
              }

            })
            .then(function (source) {
              return this.parseBuilding(source, upAxis);
            }.bind(this));

        parseBuilding: function (source, upAxis) {
          var vertices = [];
          var materials = Object.create(null);
          var materialName = 'default';
          var lines = source.split(/\r?\n/);
          for (var lineIndex = 0; lineIndex < lines.length; lineIndex++) {
            var line = lines[lineIndex].trim();
            if (!line || line.charAt(0) === '#') {
              continue;
            }
            var fields = line.split(/\s+/);
            if (fields[0] === 'v') {
              vertices.push([Number(fields[1]), Number(fields[2]), Number(fields[3])]);
            } else if (fields[0] === 'usemtl') {
              materialName = fields.slice(1).join(' ') || 'default';
            } else if (fields[0] === 'f' && fields.length >= 4) {
              if (!materials[materialName]) {
                materials[materialName] = [];
              }
              var face = fields.slice(1).map(function (value) {
                var vertexIndex = Number(value.split('/')[0]);
                return vertexIndex < 0 ? vertices.length + vertexIndex : vertexIndex - 1;
              });
              for (var triangle = 1; triangle < face.length - 1; triangle++) {
                materials[materialName].push(face[0], face[triangle], face[triangle + 1]);
              }
            }
          }
          if (!vertices.length) {
            throw new Error('City building OBJ contains no vertices.');
          }

          var axis = upAxis === 'z' ? 2 : 1;
          var min = [Infinity, Infinity, Infinity];
          var max = [-Infinity, -Infinity, -Infinity];
          for (var vertex = 0; vertex < vertices.length; vertex++) {
            for (var coordinate = 0; coordinate < 3; coordinate++) {
              min[coordinate] = Math.min(min[coordinate], vertices[vertex][coordinate]);
              max[coordinate] = Math.max(max[coordinate], vertices[vertex][coordinate]);
            }
          }
          var height = max[axis] - min[axis];
          var centerX = (min[axis === 0 ? 1 : 0] + max[axis === 0 ? 1 : 0]) / 2;
          var centerZ = (min[axis === 2 ? 1 : 2] + max[axis === 2 ? 1 : 2]) / 2;
          var model = new THREE.Group();
          var names = Object.keys(materials);
          for (var materialIndex = 0; materialIndex < names.length; materialIndex++) {
            var name = names[materialIndex];
            var indices = materials[name];
            var positions = [];
            var colors = [];
            var nameLower = name.toLowerCase();
            var isWindow = /glass|window|frost|mirror/.test(nameLower);
            var isSign = /light|emiss|neon|sign|night_scene|restaurant|robottechnology|panopticon/.test(nameLower);
            var signColors = ['#32d9ff', '#ff4fa3', '#ffb34e', '#79f2d0'];
            var baseColor = isSign
              ? signColors[materialIndex % signColors.length]
              : isWindow ? '#263c50'
              : ['#272c3b', '#37313e', '#4b3538', '#293641', '#44363c'][
                (materialIndex + name.length) % 5
              ];
            var faceColor = new THREE.Color(baseColor);
            for (var index = 0; index < indices.length; index++) {
              var point = vertices[indices[index]];
              var x;
              var y;
              var z;
              if (axis === 2) {
                x = point[0] - centerX;
                y = point[2] - min[2];
                z = point[1] - centerZ;
              } else {
                x = point[0] - centerX;
                y = point[1] - min[1];
                z = point[2] - centerZ;
              }
              positions.push(x / height, y / height, z / height);
              colors.push(faceColor.r, faceColor.g, faceColor.b);
            }
            var geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.computeVertexNormals();
            var facade = isSign
              ? new THREE.MeshBasicMaterial({

                vertexColors: true,
                roughness: isWindow ? 0.3 : 0.84,
                metalness: isWindow ? 0.3 : 0.34,

                depthWrite: !isWindow || /mirror/.test(nameLower),
                side: THREE.DoubleSide
              });
            var mesh = new THREE.Mesh(geometry, facade);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            model.add(mesh);
          }

        }

            var vessel = this.ships[ship];
            vessel.position.x = vessel.userData.startX +
              Math.sin(time * 0.00013 + ship * 2.1) * vessel.userData.drift;
            vessel.position.z = vessel.userData.startZ +
              Math.cos(time * 0.0001 + ship * 1.7) * 3.5;
            vessel.rotation.y = Math.sin(time * 0.00013 + ship * 2.1) * 0.32;
          }
        }
      });

      AFRAME.registerComponent('glass-dome', {
        init: function () {
          this.el.setAttribute('visible', false);
          var radius = 20;
          var group = new THREE.Group();
          var glassMaterial = new THREE.MeshPhysicalMaterial({
            color: '#b8c2b9',
            transparent: true,
            opacity: 0.045,
            roughness: 0.2,
            metalness: 0,
            side: THREE.DoubleSide,
            depthWrite: false
          });
          var frameMaterial = new THREE.MeshStandardMaterial({
            color: '#788078',
            metalness: 0.12,
            roughness: 0.78
          });
          var sphere = new THREE.SphereGeometry(radius, 96, 48, 0, Math.PI * 2, 0, Math.PI / 2)
            .toNonIndexed();
          var sourcePositions = sphere.attributes.position;
          var shellPositions = [];
          for (var triangle = 0; triangle < sourcePositions.count; triangle += 3) {
            var x = (sourcePositions.getX(triangle) +
              sourcePositions.getX(triangle + 1) +
              sourcePositions.getX(triangle + 2)) / 3 / radius;
            var y = (sourcePositions.getY(triangle) +
              sourcePositions.getY(triangle + 1) +
              sourcePositions.getY(triangle + 2)) / 3 / radius;
            var z = (sourcePositions.getZ(triangle) +
              sourcePositions.getZ(triangle + 1) +
              sourcePositions.getZ(triangle + 2)) / 3 / radius;
            if (z > 0.88 && Math.abs(x) < 0.12 && Math.abs(y - 0.085) < 0.12) {
              continue;
            }
            for (var vertex = 0; vertex < 3; vertex++) {
              var index = triangle + vertex;
              shellPositions.push(
                sourcePositions.getX(index),
                sourcePositions.getY(index),
                sourcePositions.getZ(index)
              );
            }
          }
          sphere = new THREE.BufferGeometry();
          sphere.setAttribute('position', new THREE.Float32BufferAttribute(shellPositions, 3));
          sphere.computeVertexNormals();
          var shell = new THREE.Mesh(sphere, glassMaterial);
          group.add(shell);

          for (var rib = 0; rib < 12; rib++) {
            var angle = rib * Math.PI / 6;
            if (Math.sin(angle) > 0.98 && Math.abs(Math.cos(angle)) < 0.08) {
              continue;
            }
            var points = [];
            for (var step = 0; step <= 24; step++) {
              var theta = (step / 24) * Math.PI / 2;
              points.push(new THREE.Vector3(
                Math.sin(theta) * radius * Math.cos(angle),
                Math.cos(theta) * radius,
                Math.sin(theta) * radius * Math.sin(angle)
              ));
            }
            var ribMesh = new THREE.Mesh(
              new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 32, 0.035, 5, false),
              frameMaterial
            );
            group.add(ribMesh);
          }

          var levels = [4, 9, 14, 18];
          for (var level = 0; level < levels.length; level++) {
            var y = levels[level];
            var ringRadius = Math.sqrt(radius * radius - y * y);
            var ring = new THREE.Mesh(
              new THREE.TorusGeometry(ringRadius, 0.035, 5, 96),
              frameMaterial
            );
            ring.rotation.x = Math.PI / 2;
            ring.position.y = y;
            group.add(ring);
          }

          this.el.setObject3D('mesh', group);
        }
      });

      AFRAME.registerComponent('mine-exit', {
        init: function () {
          this.started = false;
          this.walking = false;
          this.el.sceneEl.querySelector('#garden-set').setAttribute('visible', false);
          this.el.sceneEl.querySelector('#garden-dome').setAttribute('visible', false);
          this.onClick = function (event) {
            if (!event.isTrusted && !(event.detail && event.detail.cursorEl)) {
              return;
            }
            this.walkThrough();
          }.bind(this);
          this.el.addEventListener('click', this.onClick);
        },

        walkThrough: function () {
          if (this.started) {
            return;
          }
          this.started = true;
          this.el.classList.remove('clickable');
          var gardenSet = this.el.sceneEl.querySelector('#garden-set');
          gardenSet.querySelectorAll('[dialogue-trigger]').forEach(function (entity) {
            var dialogue = entity.components['dialogue-trigger'];
            if (dialogue) {
              dialogue.hide();
              dialogue.suspended = true;
            }
          });
          gardenSet.setAttribute('visible', true);
          this.el.sceneEl.querySelector('#garden-dome').setAttribute('visible', true);
          this.viewer = this.el.sceneEl.querySelector('#viewer');
          this.viewer.removeAttribute('animation__cave-dive');
          this.viewer.removeAttribute('animation__cave-turn');
          this.walkStart = this.viewer.object3D.position.clone();
          this.startRotation = this.viewer.object3D.rotation.clone();
          this.walkPath = new THREE.CatmullRomCurve3([
            this.walkStart,
            new THREE.Vector3(1.35, 0, -11.2),
            new THREE.Vector3(2.2, 0, -17),
            new THREE.Vector3(3.4, 0, -23.3),
            new THREE.Vector3(3.4, 0, -26),
            new THREE.Vector3(3.4, 0, -28.5),
            new THREE.Vector3(3.2, 0, -30),
            new THREE.Vector3(2.2, 0, -31.4),
            new THREE.Vector3(0, 0, -32.5),
            new THREE.Vector3(0, 0, -35),
            new THREE.Vector3(0, 0, -48)
          ], false, 'centripetal');
          this.walkElapsed = 0;
          this.walkDuration = 10000;
          this.walking = true;
        },

        tick: function (time, delta) {
          if (!this.walking) {
            return;
          }
          this.walkElapsed = Math.min(this.walkElapsed + delta, this.walkDuration);
          var progress = this.walkElapsed / this.walkDuration;
          var easedProgress = progress * progress * (3 - 2 * progress);
          var pathPosition = this.walkPath.getPointAt(easedProgress);
          var direction;
          if (easedProgress > 0.998) {
            direction = pathPosition.clone()
              .sub(this.walkPath.getPointAt(Math.max(easedProgress - 0.002, 0)));
          } else {
            direction = this.walkPath.getPointAt(easedProgress + 0.002)
              .sub(pathPosition);
          }
          direction.normalize();
          var targetYaw = Math.atan2(-direction.x, -direction.z);
          var startYaw = this.startRotation.y;
          var yawDelta = Math.atan2(
            Math.sin(targetYaw - startYaw),
            Math.cos(targetYaw - startYaw)
          );
          var turnIn = Math.min(progress / 0.06, 1);
          var easedTurnIn = turnIn * turnIn * (3 - 2 * turnIn);

          this.viewer.object3D.position.copy(pathPosition);
          this.viewer.object3D.rotation.y = startYaw + yawDelta * easedTurnIn;

          if (progress >= 1) {
            this.walking = false;
            this.finishTransition();
          }
        },

        finishTransition: function () {
          this.walking = false;
          var scene = this.el.sceneEl;
          var gardenSet = scene.querySelector('#garden-set');
          gardenSet.querySelectorAll('[dialogue-trigger]').forEach(function (entity) {
            var dialogue = entity.components['dialogue-trigger'];
            if (dialogue) {
              dialogue.hide();
              dialogue.suspended = false;
            }
          });
        }
      });

      AFRAME.registerComponent('stl-ring', {
        schema: {src: {type: 'string'}},

        init: function () {
          this.spinning = true;
          this.transitionStarted = false;
          this.alignmentStarted = false;
          this.baseY = this.el.object3D.position.y;
          this.el.addEventListener('click', this.alignAndEnter.bind(this));

          fetch(this.data.src)
            .then(function (response) {
              if (!response.ok) {
                throw new Error('Unable to load ring model: ' + response.status);
              }
              return response.arrayBuffer();
            })
            .then(this.addModel.bind(this))
            .catch(function (error) {
              console.error(error);
            });
        },

        addModel: function (buffer) {
          var view = new DataView(buffer);
          var triangleCount = view.getUint32(80, true);
          var positions = new Float32Array(triangleCount * 9);
          var normals = new Float32Array(triangleCount * 9);
          var colors = new Float32Array(triangleCount * 9);
          var offset = 84;

          if (buffer.byteLength < offset + triangleCount * 50) {
            throw new Error('Ring model is not a valid binary STL file.');
          }

          for (var triangle = 0; triangle < triangleCount; triangle++) {
            var normal = [
              view.getFloat32(offset, true),
              view.getFloat32(offset + 4, true),
              view.getFloat32(offset + 8, true)
            ];
            offset += 12;
            var centerX = 0;
            var centerY = 0;
            var centerZ = 0;

            for (var vertex = 0; vertex < 3; vertex++) {
              var index = triangle * 9 + vertex * 3;
              positions[index] = view.getFloat32(offset, true);
              positions[index + 1] = view.getFloat32(offset + 4, true);
              positions[index + 2] = view.getFloat32(offset + 8, true);
              centerX += positions[index] / 3;
              centerY += positions[index + 1] / 3;
              centerZ += positions[index + 2] / 3;
              normals.set(normal, index);
              offset += 12;
            }
            var angle = Math.atan2(centerZ, centerX);
            var band = 0.5 + 0.5 * Math.sin(angle * 9 + centerY * 7);
            var color = new THREE.Color('#190d20')
              .lerp(new THREE.Color('#9c2047'), 0.45 + band * 0.42);
            color.lerp(new THREE.Color('#ff7550'), THREE.MathUtils.smoothstep(band, 0.7, 1) * 0.7);
            color.lerp(new THREE.Color('#ffc36b'),
              THREE.MathUtils.smoothstep(Math.abs(normal[1]), 0.72, 0.98) * band * 0.55);
            if (band < 0.16) {
              color.lerp(new THREE.Color('#29d5e8'), (0.16 - band) * 2.5);
            }
            for (var colorVertex = 0; colorVertex < 3; colorVertex++) {
              colors.set([color.r, color.g, color.b], triangle * 9 + colorVertex * 3);
            }
            offset += 2;
          }

          var geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          geometry.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
          geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
          geometry.computeBoundingBox();

          var bounds = geometry.boundingBox;
          var center = new THREE.Vector3();
          var size = new THREE.Vector3();
          bounds.getCenter(center);
          bounds.getSize(size);
          geometry.translate(-center.x, -center.y, -center.z);
          var scale = 2.4 / Math.max(size.x, size.y, size.z);
          geometry.scale(scale, scale, scale);
          geometry.rotateX(Math.PI / 2);
          geometry.computeBoundingSphere();

          var material = new THREE.MeshStandardMaterial({
            color: '#ffffff',
            vertexColors: true,
            metalness: 0.68,
            roughness: 0.3,
            emissive: '#310716',
            emissiveIntensity: 0.22
          });
          var ringMesh = new THREE.Mesh(geometry, material);
          ringMesh.castShadow = true;
          ringMesh.receiveShadow = true;
          this.el.setObject3D('mesh', ringMesh);
        },

        alignAndEnter: function () {
          if (this.transitionStarted || this.alignmentStarted) {
            return;
          }
          this.alignmentStarted = true;
          this.spinning = false;
          this.alignmentStart = this.el.object3D.rotation.y;
          this.alignmentTarget = Math.round(this.alignmentStart / (Math.PI * 2)) * Math.PI * 2;
          this.alignmentElapsed = 0;
        },

        enterCave: function () {
          this.transitionStarted = true;
          var scene = this.el.sceneEl;
          this.transitionElapsed = 0;
          this.travelDuration = 5000;
          var uncleDialogue = scene.querySelector('#miner').components['dialogue-trigger'];
          uncleDialogue.hide();
          scene.querySelector('#garden-set').setAttribute('visible', false);
          scene.querySelector('#garden-dome').setAttribute('visible', false);
          var caveSet = scene.querySelector('#cave-set');
          caveSet.setAttribute('scale', '0.01 0.01 0.01');
          caveSet.setAttribute('visible', true);
          caveSet.setAttribute('animation__emerge', {
            property: 'scale',
            to: '1 1 1',
            dur: this.travelDuration,
            easing: 'easeOutCubic'
          });
          scene.querySelector('#cave-lighting').setAttribute('visible', true);
          scene.querySelector('#viewer').setAttribute('animation__cave-dive', {
            property: 'position',
            to: '0 0 -6',
            dur: this.travelDuration,
            easing: 'easeInOutSine'
          });
          scene.querySelector('#viewer').setAttribute('animation__cave-turn', {
            property: 'rotation',
            to: '-6 -15 0',
            dur: this.travelDuration,
            easing: 'easeInOutSine'
          });
        },

        tick: function (time, delta) {
          if (this.transitionStarted && !this.travelFinished) {
            this.transitionElapsed += delta;
            if (this.transitionElapsed >= this.travelDuration) {
              var scene = this.el.sceneEl;
              scene.querySelector('[stl-ring]').setAttribute('visible', false);
              scene.querySelector('#ring-label').setAttribute('visible', false);
              this.travelFinished = true;
            }
            return;
          }
          if (!this.el.getObject3D('mesh')) {
            return;
          }
          if (this.spinning) {
            this.el.object3D.rotation.y += delta * 0.0003;
            this.el.object3D.position.y = this.baseY + Math.sin(time * 0.001) * 0.12;
          } else if (this.alignmentStarted && !this.transitionStarted) {
            this.alignmentElapsed = Math.min(this.alignmentElapsed + delta, 1600);
            var progress = this.alignmentElapsed / 1600;
            var easedProgress = 0.5 - Math.cos(progress * Math.PI) / 2;
            this.el.object3D.rotation.y = this.alignmentStart +
              (this.alignmentTarget - this.alignmentStart) * easedProgress;

            if (progress === 1) {
              this.el.object3D.rotation.y = this.alignmentTarget;
              this.enterCave();
            }
          }
        }
      });
    </script>
  </head>
